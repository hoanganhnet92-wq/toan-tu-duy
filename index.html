<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toán tư duy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Toán tư duy cho bé 4 tuổi – Lộ trình 4 tuần</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#23302d; --muted:#667570;
  --brand:#2f7d6d; --brand-soft:#e1f0ec; --gold:#c98a12; --gold-soft:#fbf0d6;
  --red:#b4513f; --red-soft:#f8e6e1; --line:#e3ded2; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:16px 16px 12px}
header h1{margin:0;font-size:1.15rem;line-height:1.3}
header p{margin:2px 0 0;font-size:.82rem;opacity:.9}
.wrap{max-width:720px;margin:0 auto}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:#ffd36b;width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-top:6px;opacity:.95}
.weeks{display:flex;gap:6px;max-width:720px;margin:0 auto;padding:12px 14px 0}
.wk{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-size:.82rem;cursor:pointer;text-align:center}
.wk.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.wk.coach{background:var(--gold-soft);border-color:var(--gold);color:#7a5200;font-weight:600}
.wk.coach.active{background:var(--gold);border-color:var(--gold);color:#fff}
.days{display:flex;gap:6px;max-width:720px;margin:0 auto;padding:8px 14px 2px}
.dy{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 2px;text-align:center;font-size:.72rem;cursor:pointer;position:relative}
.dy b{display:block;font-size:.95rem}
.dy .mk{display:block;height:1.1em;font-size:.72rem;font-weight:700}
.dy.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.dy.pass .mk{color:var(--brand)} .dy.redo .mk{color:var(--red)}
.dy.today::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
main{max-width:720px;margin:0 auto;padding:6px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:10px}
.head{display:flex;gap:10px;align-items:flex-start}
.head h2{margin:0;font-size:1.15rem;line-height:1.3;flex:1}
.star{border:1px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;font-size:1.3rem;cursor:pointer;flex:0 0 auto;color:#b9b2a0}
.star.on{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.badge{display:inline-block;font-size:.72rem;background:var(--gold-soft);color:#7a5200;border-radius:99px;padding:2px 10px;margin:0 4px 6px 0}
.badge.area{background:var(--brand-soft);color:#1d5a4d}
.goal{color:var(--muted);margin:8px 0 0;font-size:.92rem}
h3{margin:16px 0 6px;font-size:.95rem;color:var(--brand)}
ol,ul{margin:0;padding-left:1.2rem} li{margin:4px 0}
.ask{background:var(--brand-soft);border-radius:12px;padding:10px 12px}
.lv{display:grid;gap:8px}
.lv div{border-radius:12px;padding:10px 12px;font-size:.92rem}
.lv .e{background:#eef4fb} .lv .h{background:var(--gold-soft)}
.src{font-size:.78rem;color:var(--muted);margin-top:12px}
.src a{color:var(--brand)}
.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.check input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--brand);flex:0 0 auto}
.check.on{border-color:var(--brand);background:var(--brand-soft)}
.check strong{display:block}
.check small{color:var(--muted);display:block;font-size:.82rem;line-height:1.4;margin-top:2px}
.redo-note{background:var(--red-soft);color:#7c2f22;border-radius:12px;padding:10px 12px;font-size:.88rem}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;resize:vertical}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer}
.nav .btn{flex:1}
.btn:disabled{opacity:.4}
.btn.danger{color:var(--red)}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.pick small{display:block;color:var(--muted);font-size:.8rem}
details{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:center;width:4.2em}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brand)}
.muted{color:var(--muted);font-size:.85rem}
.tools label{display:block;margin:8px 0}
.tools input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-left:6px;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kids{display:flex;gap:8px;padding:8px 10px;background:#17413a}
.kid{flex:1;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.72);border-radius:12px;padding:7px 4px;cursor:pointer;text-align:center;line-height:1.15}
.kid b{display:block;font-size:.95rem}
.kid small{font-size:.72rem;opacity:.8}
.kid.active{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
.solo{display:flex;align-items:center;gap:12px;margin:10px 0}
.solo .btn{width:46px;height:46px;font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.solo b{font-size:1.6rem;min-width:2em;text-align:center;color:var(--brand)}
.lnk{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-size:inherit}
</style>
</head>
<body>
<nav class="kids" id="kids" aria-label="Chọn bé"></nav>
<header>
  <div class="wrap">
    <h1 id="hTitle">Toán tư duy cho bé 4 tuổi</h1>
    <p id="hLead">Lộ trình 4 tuần · mỗi ngày 10–15 phút · chơi bằng đồ thật</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats"><span id="sPlayed"></span><span id="sPassed"></span><span id="sRedo"></span></div>
  </div>
</header>
<nav class="weeks" id="weeks" aria-label="Chọn tuần"></nav>
<nav class="days" id="days" aria-label="Chọn ngày"></nav>
<main id="main"></main>

<script src="data.js"></script>
<script src="data-tin.js"></script>
<script>
"use strict";
var N = 28;

/* ----- hai bé: mỗi bé một bộ dữ liệu và một tiến độ riêng ----- */
var POOH_A = AREAS, POOH_W = WEEKS, POOH_G = GAMES;
var KIDS = {
  pooh: { name:"Pooh", age:"5 tuổi", key:"toan-tu-duy-v2",
    title:"Toán tư duy cho Pooh",
    lead:"Lộ trình 4 tuần · mỗi ngày 10–15 phút · chơi bằng đồ thật",
    pass:"Bé đạt yêu cầu", passWord:"Đạt", redoWord:"Cần chơi lại",
    wrLabel:"Theo các khối White Rose Reception",
    areaTitle:"Tổng kết theo mảng toán",
    areaNote:"Sáu mảng theo khung toán mầm non của NCETM (Anh). Mảng nào tỉ lệ đạt thấp thì nên chơi thêm.",
    A:POOH_A, W:POOH_W, G:POOH_G },
  tin: { name:"Tin", age:"16–18 tháng", key:"toan-tu-duy-tin-v1",
    title:"Hoạt động cho Tin",
    lead:"Lộ trình 4 tuần · mỗi ngày 5–10 phút · chơi bằng đồ thật",
    pass:"Bé hứng thú, muốn chơi lại", passWord:"Thích", redoWord:"Thử lại sau",
    wrLabel:"Mốc phát triển tham khảo",
    areaTitle:"Tổng kết theo mảng phát triển",
    areaNote:"Năm mảng phát triển của trẻ tập đi. Ở tuổi này không có đạt hay không đạt — cột bên chỉ ghi nhận bé có hứng thú hay không.",
    A:TIN_AREAS, W:TIN_WEEKS, G:TIN_GAMES }
};
var KID = (function(){ try{ return localStorage.getItem("tt-kid")==="tin" ? "tin" : "pooh"; }catch(e){ return "pooh"; } })();
var KEY = KIDS[KID].key;
function kidApply(){ var k = KIDS[KID]; AREAS=k.A; WEEKS=k.W; GAMES=k.G; KEY=k.key; }
kidApply();

var state = load();
var view = "day";            // "day" | "sum" | "coach"
var current = initialDay();

function blank(){ return {start:"", played:zeros(), passed:zeros(), fav:zeros(), notes:{}, solo:[0,0,0,0]}; }
function fixSolo(s){ if(!Array.isArray(s.solo) || s.solo.length!==4) s.solo=[0,0,0,0]; return s; }
function zeros(){ var a=[]; for(var i=0;i<N;i++) a.push(0); return a; }
function valid(s){ return s && Array.isArray(s.played) && s.played.length===N && Array.isArray(s.passed) && s.passed.length===N && Array.isArray(s.fav) && s.fav.length===N; }
function load(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(valid(s)){ if(!s.notes) s.notes = {}; return fixSolo(s); }
    var old = JSON.parse(localStorage.getItem("toan-tu-duy-v1") || "null");
    var b = blank(); if(old && old.start) b.start = old.start; return b;
  }catch(e){ return blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ----- cấu trúc ngày ----- */
function kind(d){ var p = d%7; return p<5 ? "game" : (p===5 ? "replay" : "review"); }
function gameOf(d){ return kind(d)==="game" ? GAMES[Math.floor(d/7)*5 + d%7] : null; }
function gameDays(){ var a=[]; for(var d=0;d<N;d++) if(kind(d)==="game") a.push(d); return a; }
function needsRedo(d){ return kind(d)==="game" && state.played[d] && !state.passed[d]; }
function todayIndex(){
  if(!state.start) return null;
  var a = new Date(state.start+"T00:00:00"), b = new Date(); b.setHours(0,0,0,0);
  var n = Math.round((b-a)/86400000);
  return (n>=0 && n<N) ? n : null;
}
/* Thứ thật của ngày d, tính từ ngày bắt đầu; chưa đặt ngày bắt đầu thì ghi loại ngày */
function dowLabel(d){
  if(state.start){
    var x = new Date(state.start+"T00:00:00"); x.setDate(x.getDate()+d);
    if(!isNaN(x)) return ["CN","T2","T3","T4","T5","T6","T7"][x.getDay()];
  }
  var k = kind(d); return k==="game" ? "Trò" : (k==="replay" ? "Lại" : "Ôn");
}
function initialDay(){
  var t = todayIndex(); if(t!==null) return t;
  for(var d=0;d<N;d++){ if(!state.played[d]) return d; }
  return 0;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function li(a){ return a.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join(""); }
function count(arr, days){ return days.reduce(function(n,d){ return n + (arr[d]?1:0); }, 0); }

/* ----- thanh trên ----- */
function renderKids(){
  var h = "";
  Object.keys(KIDS).forEach(function(k){
    h += '<button class="kid'+(k===KID?" active":"")+'" data-kid="'+k+'"><b>'+esc(KIDS[k].name)+'</b><small>'+esc(KIDS[k].age)+'</small></button>';
  });
  document.getElementById("kids").innerHTML = h;
  document.getElementById("hTitle").textContent = KIDS[KID].title;
  document.getElementById("hLead").textContent = KIDS[KID].lead;
}
function switchKid(k){
  if(k===KID) return;
  KID = k; try{ localStorage.setItem("tt-kid", k); }catch(e){}
  kidApply();
  state = load(); current = initialDay(); view = "day";
  renderKids(); renderAll(); window.scrollTo(0,0);
}
function renderTop(){
  renderKids();
  var gd = gameDays(), played = count(state.played, gd), passed = count(state.passed, gd);
  var redo = gd.filter(needsRedo).length;
  document.getElementById("sPlayed").textContent = "Đã chơi "+played+"/"+gd.length;
  document.getElementById("sPassed").textContent = KIDS[KID].passWord+" "+passed+"/"+gd.length;
  document.getElementById("sRedo").textContent = KIDS[KID].redoWord+" "+redo;
  document.getElementById("bar").style.width = Math.round(passed/gd.length*100)+"%";

  var w = Math.floor(current/7), h = "";
  for(var i=0;i<4;i++) h += '<button class="wk'+(view==="day"&&i===w?" active":"")+'" data-w="'+i+'">Tuần '+(i+1)+'</button>';
  h += '<button class="wk coach'+(view==="coach"?" active":"")+'" data-w="coach">Cách hỏi</button>';
  h += '<button class="wk'+(view==="sum"?" active":"")+'" data-w="sum">Tổng kết</button>';
  document.getElementById("weeks").innerHTML = h;

  var t = todayIndex(), g = "";
  if(view==="day"){
    for(var p=0;p<7;p++){
      var d = w*7+p, cls = "dy", mk = "";
      if(d===current) cls += " active";
      if(d===t) cls += " today";
      if(kind(d)==="game"){
        if(state.passed[d]){ cls += " pass"; mk = "✓✓"; }
        else if(state.played[d]){ cls += " redo"; mk = "↻"; }
      } else if(state.played[d]){ cls += " pass"; mk = "✓"; }
      g += '<button class="'+cls+'" data-d="'+d+'"><span class="mk">'+mk+'</span><b>'+(d+1)+'</b>'+dowLabel(d)+'</button>';
    }
  }
  document.getElementById("days").innerHTML = g;
}

/* ----- trang ngày ----- */
function checksHtml(d, withPass, passTxt){
  var h = '<div class="checks">'
    + '<label class="check'+(state.played[d]?' on':'')+'"><input type="checkbox" id="cPlayed"'+(state.played[d]?' checked':'')+'><span><strong>Đã chơi</strong><small>Tích sau khi hai bố con/mẹ con chơi xong.</small></span></label>';
  if(withPass){
    h += '<label class="check'+(state.passed[d]?' on':'')+'"><input type="checkbox" id="cPassed"'+(state.passed[d]?' checked':'')+'><span><strong>'+esc(KIDS[KID].pass)+'</strong><small>'+esc(passTxt)+'</small></span></label>';
    if(needsRedo(d)) h += '<div class="redo-note">Trò này đang ở trạng thái <b>'+esc(KIDS[KID].redoWord.toLowerCase())+'</b>. Nó sẽ tự hiện trong ngày ôn cuối tuần. Chưa đạt là bình thường, không cần ép bé.</div>';
  }
  return h + '</div>';
}
function notesHtml(d){
  return '<h3>Ghi chú của bố mẹ</h3><textarea id="note" placeholder="Ví dụ: con hay nhầm khi che 3 viên, con thích phần đổi vai…">'+esc(state.notes[d]||"")+'</textarea>';
}
function pickBtn(d){
  var g = gameOf(d);
  return '<button class="pick" data-go="'+d+'"><b>Ngày '+(d+1)+': '+esc(g.title)+'</b><small>'+esc(AREAS[g.area])+'</small></button>';
}
function renderDay(){
  var d = current, w = Math.floor(d/7), k = kind(d), t = todayIndex(), h = "";
  var lead = (d===t ? "Hôm nay · " : "") + "Tuần "+(w+1)+" · Ngày "+(d+1);

  if(d%7===0){
    h += '<details><summary>Tuần '+(w+1)+': '+esc(WEEKS[w].title)+' · đồ cần chuẩn bị</summary>'
      + '<p class="muted">'+esc(KIDS[KID].wrLabel)+': '+esc(WEEKS[w].wr)+'</p><ul>'+li(WEEKS[w].mats)+'</ul></details>';
  }

  if(k==="game"){
    var g = gameOf(d);
    h += '<div class="card"><span class="badge">'+esc(lead)+'</span><span class="badge area">'+esc(AREAS[g.area])+'</span>'
      + '<div class="head"><h2>'+esc(g.title)+'</h2><button class="star'+(state.fav[d]?' on':'')+'" id="fav" aria-label="Bé thích trò này" title="Bé thích trò này">★</button></div>'
      + '<p class="goal"><b>Mục tiêu:</b> '+esc(g.goal)+'</p>'
      + '<h3>Chuẩn bị</h3><div>'+esc(g.mats)+'</div>'
      + '<h3>Cách chơi</h3><ol>'+li(g.steps)+'</ol>'
      + '<h3>Câu hỏi nên hỏi bé</h3><div class="ask"><ul>'+li(g.ask)+'</ul>'
      + '<p class="muted" style="margin:8px 0 0">Khi bé bế tắc: đếm thầm 10 giây, rồi hỏi “Con đang vướng ở bước nào?” — đừng giảng ngay. <button class="lnk" data-coach="1">Xem cách hỏi</button></p></div>'
      + '<h3>Điều chỉnh mức độ</h3><div class="lv"><div class="e"><b>Dễ hơn:</b> '+esc(g.easy)+'</div><div class="h"><b>Khó hơn:</b> '+esc(g.hard)+'</div></div>'
      + '<p class="src">Bước trong lộ trình: '+esc(g.wr)+'.<br>'+esc(g.src)+(g.link?' · <a href="'+esc(g.link)+'" target="_blank" rel="noopener">xem nguồn</a>':'')+'.</p>'
      + '</div>'
      + '<div class="card"><h3 style="margin-top:0">Theo dõi</h3>'+checksHtml(d, true, g.pass)+notesHtml(d)+'</div>';
  } else if(k==="replay"){
    var favs = gameDays().filter(function(x){ return x<d && state.fav[x]; });
    var wk = []; for(var x=w*7;x<w*7+5;x++) wk.push(x);
    h += '<div class="card"><span class="badge">'+esc(lead)+'</span><div class="head"><h2>Ngày chơi lại trò con thích</h2></div>'
      + '<p class="goal">Để bé tự chọn một trò. Chơi lại trò quen giúp bé tự tin và hiểu sâu hơn; thử thêm phần “Khó hơn” nếu bé làm rất dễ.</p>'
      + '<h3>'+(favs.length?'Các trò bé đã thích (★)':'Các trò của tuần này')+'</h3>'
      + (favs.length?favs:wk).map(pickBtn).join("")
      + (favs.length?'':'<p class="muted">Bấm ★ ở trò bé thích để lần sau trò đó hiện ở đây.</p>')
      + '</div><div class="card"><h3 style="margin-top:0">Theo dõi</h3>'+checksHtml(d,false)+notesHtml(d)+'</div>';
  } else {
    var redo = gameDays().filter(function(x){ return x<d && needsRedo(x); });
    var notPlayed = gameDays().filter(function(x){ return x<d && !state.played[x]; });
    h += '<div class="card"><span class="badge">'+esc(lead)+'</span><div class="head"><h2>'+(d===N-1?'Ngày ôn và tổng kết tháng':'Ngày ôn')+'</h2></div>'
      + '<p class="goal">Chơi lại những trò chưa đạt, bắt đầu từ mức “Dễ hơn”. Khi bé đạt, mở trò đó và tích “Bé đạt yêu cầu”.</p>'
      + '<h3>'+esc(KIDS[KID].redoWord)+'</h3>'+(redo.length?redo.map(pickBtn).join(""):'<p class="muted">Không có trò nào cần chơi lại. Cho bé chọn một trò bất kỳ hoặc nghỉ.</p>')
      + (notPlayed.length?'<h3>Chưa chơi</h3>'+notPlayed.map(pickBtn).join(""):'')
      + (d===N-1?'<p style="margin-top:12px"><button class="btn" data-sum="1">Xem tổng kết tháng</button></p>':'')
      + '</div><div class="card"><h3 style="margin-top:0">Theo dõi</h3>'+checksHtml(d,false)+notesHtml(d)+'</div>';
  }
  h += '<div class="nav"><button class="btn" id="prev"'+(d===0?' disabled':'')+'>← Ngày trước</button><button class="btn" id="next"'+(d===N-1?' disabled':'')+'>Ngày sau →</button></div>';
  document.getElementById("main").innerHTML = h;
}

/* ----- trang tổng kết ----- */
function renderSum(){
  var gd = gameDays(), h = '<div class="card"><h2 style="margin:0;font-size:1.1rem">'+esc(KIDS[KID].areaTitle)+'</h2>'
    + '<p class="muted">'+esc(KIDS[KID].areaNote)+'</p>'
    + '<table><tr><th>Mảng</th><th class="n">Đã chơi</th><th class="n">'+esc(KIDS[KID].passWord)+'</th></tr>';
  Object.keys(AREAS).forEach(function(a){
    var ds = gd.filter(function(d){ return gameOf(d).area===a; });
    var pl = count(state.played, ds), ps = count(state.passed, ds);
    h += '<tr><td>'+esc(AREAS[a])+'<div class="meter"><i style="width:'+(ds.length?Math.round(ps/ds.length*100):0)+'%"></i></div></td><td class="n">'+pl+'/'+ds.length+'</td><td class="n">'+ps+'/'+ds.length+'</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="card"><h3 style="margin-top:0">Theo tuần</h3><table><tr><th>Tuần</th><th class="n">Đã chơi</th><th class="n">'+esc(KIDS[KID].passWord)+'</th><th class="n">Tự vượt khó</th></tr>';
  for(var w=0;w<4;w++){
    var ds = gd.filter(function(d){ return Math.floor(d/7)===w; });
    h += '<tr><td>'+(w+1)+'. '+esc(WEEKS[w].title)+'</td><td class="n">'+count(state.played,ds)+'/5</td><td class="n">'+count(state.passed,ds)+'/5</td><td class="n">'+state.solo[w]+'</td></tr>';
  }
  h += '</table><p class="muted">Cột “Tự vượt khó”: số lần bố mẹ để con tự vượt qua chỗ khó, tự đếm ở trang <button class="lnk" data-coach="1">Cách hỏi</button>. Cột này quan trọng hơn hai cột kia.</p></div>';

  var redo = gd.filter(needsRedo), favs = gd.filter(function(d){ return state.fav[d]; });
  h += '<div class="card"><h3 style="margin-top:0">'+esc(KIDS[KID].redoWord)+'</h3>'+(redo.length?redo.map(pickBtn).join(""):'<p class="muted">Chưa có trò nào.</p>')
    + '<h3>Bé thích (★)</h3>'+(favs.length?favs.map(pickBtn).join(""):'<p class="muted">Chưa đánh dấu trò nào.</p>')+'</div>';

  var notes = Object.keys(state.notes).map(Number).sort(function(a,b){return a-b;}).filter(function(d){ return state.notes[d]; });
  h += '<div class="card"><h3 style="margin-top:0">Ghi chú đã viết</h3>'
    + (notes.length ? notes.map(function(d){ var g=gameOf(d); return '<p><b>Ngày '+(d+1)+(g?': '+esc(g.title):'')+'</b><br>'+esc(state.notes[d]).replace(/\n/g,"<br>")+'</p>'; }).join("") : '<p class="muted">Chưa có ghi chú.</p>')
    + '</div>';

  h += '<div class="card tools"><h3 style="margin-top:0">Cài đặt và sao lưu</h3>'
    + '<label>Ngày bắt đầu lộ trình: <input type="date" id="start" value="'+esc(state.start)+'"></label>'
    + '<div class="row"><button class="btn" id="btnToday">Bắt đầu từ hôm nay</button></div>'
    + '<p class="muted" style="margin-top:14px">Tiến độ chỉ lưu trên thiết bị này. Bấm “Tạo mã sao lưu”, sao chép đoạn mã và cất vào ghi chú hoặc tin nhắn. Khi đổi máy, dán mã vào ô dưới rồi bấm “Khôi phục”.</p>'
    + '<textarea id="code" placeholder="Mã sao lưu sẽ hiện ở đây, hoặc dán mã cũ vào đây"></textarea>'
    + '<div class="row"><button class="btn" id="btnExport">Tạo mã sao lưu</button><button class="btn" id="btnCopy">Sao chép</button><button class="btn" id="btnImport">Khôi phục</button><button class="btn danger" id="btnReset">Xóa tiến độ</button></div>'
    + '<p class="muted" id="msg"></p></div>';

  h += '<p class="src" style="padding:0 4px">' + (KID==="pooh"
    ? 'Thứ tự lộ trình theo các khối White Rose Maths Reception (4–5 tuổi). Trò chơi được soạn lại bằng tiếng Việt, lấy ý tưởng từ <a href="'+LINKS.nrich+'" target="_blank" rel="noopener">NRICH Early Years (Đại học Cambridge)</a> và <a href="'+LINKS.dreme+'" target="_blank" rel="noopener">DREME Family Math (Stanford)</a>; sáu mảng theo <a href="'+LINKS.ncetm+'" target="_blank" rel="noopener">NCETM</a>. Đây không phải giáo án chính thức của Cambridge Early Years. Tiêu chí “đạt” là gợi ý tham khảo, bố mẹ điều chỉnh theo bé.'
    : 'Mốc phát triển tham khảo bảng milestone 18 tháng của <a href="'+TIN_LINKS.cdc+'" target="_blank" rel="noopener">CDC (Learn the Signs. Act Early)</a>. Hoạt động soạn lại bằng tiếng Việt, lấy ý tưởng từ <a href="'+TIN_LINKS.ya+'" target="_blank" rel="noopener">Special Olympics Young Athletes</a> và <a href="'+TIN_LINKS.dreme+'" target="_blank" rel="noopener">DREME Family Math (Stanford)</a>. Ở tuổi 16–18 tháng mỗi bé một nhịp, chênh lệch vài tháng là bình thường; đây không phải thang đánh giá. Nếu anh/chị lo về mốc phát triển của bé, hỏi bác sĩ nhi thay vì dựa vào app.')
    + '</p>';
  document.getElementById("main").innerHTML = h;
}

/* ----- trang Cách hỏi ----- */
function renderCoach(){
  var w = Math.floor(current/7), h = "";

  h += '<div class="card"><span class="badge">Dành cho bố mẹ</span>'
    + '<div class="head"><h2>Cách hỏi quan trọng hơn trò chơi</h2></div>'
    + '<p class="goal">'+esc(COACH.intro)+'</p></div>';

  h += '<div class="card"><h3 style="margin-top:0">Ba thói quen nền</h3>';
  COACH.seeds.forEach(function(s,i){
    h += '<p><b>'+(i+1)+'. '+esc(s.t)+'</b><br><span class="muted">'+esc(s.d)+'</span></p>';
  });
  h += '</div>';

  h += '<div class="card"><h3 style="margin-top:0">Bảng đổi câu hỏi</h3>'
    + '<p class="muted">Đổi câu hỏi là đổi thói quen tư duy của cả nhà. Các câu bên phải chỉ có tác dụng nếu hỏi bằng giọng tò mò thật, không phải giọng kiểm tra.</p>'
    + '<table><tr><th>Thay vì hỏi</th><th>Hãy hỏi</th><th>Dùng khi</th></tr>';
  COACH.swaps.forEach(function(s){
    h += '<tr><td class="muted">'+esc(s.bad)+'</td><td><b>'+esc(s.good)+'</b></td><td class="muted">'+esc(s.when)+'</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="card"><h3 style="margin-top:0">Tự kiểm tra cuối tuần</h3>'
    + '<p class="goal">'+esc(COACH.weekCheck)+'</p>'
    + '<div class="solo"><button class="btn" data-solo="-1" aria-label="Bớt một">−</button>'
    + '<b id="soloN">'+state.solo[w]+'</b>'
    + '<button class="btn" data-solo="1" aria-label="Thêm một">+</button>'
    + '<span class="muted">lần · tuần '+(w+1)+'</span></div>'
    + (state.solo[w]===0 ? '<p class="redo-note">Nếu con số là 0, vấn đề nằm ở bố mẹ, không ở con.</p>' : '')
    + '</div>';

  h += '<div class="card"><h3 style="margin-top:0">Bảy cái bẫy bố mẹ dễ rơi vào</h3><ol>'+li(COACH.traps)+'</ol></div>';

  h += '<div class="card"><h3 style="margin-top:0">Dấu hiệu đang đi đúng hướng</h3>'
    + '<p class="muted">Không đo bằng điểm hay số trò đã chơi. Đo bằng những câu con tự nói ra.</p>'
    + '<table><tr><th>Mốc</th><th>Dấu hiệu</th><th>Nếu chưa thấy</th></tr>';
  COACH.milestones.forEach(function(m){
    h += '<tr><td>'+esc(m.m)+'</td><td><b>'+esc(m.sign)+'</b></td><td class="muted">'+esc(m.fix)+'</td></tr>';
  });
  h += '</table></div>';

  h += '<p class="src" style="padding:0 4px">Phần này soạn từ nguyên lý siêu nhận thức (metacognition) và retrieval practice trong khoa học học tập, không phải từ một giáo án cụ thể. Mục tiêu dài hạn: khi vào lớp 1, bé coi việc chưa biết là bình thường và có phản xạ tự thử trước khi nhờ.</p>';

  document.getElementById("main").innerHTML = h;
}

/* ----- sao lưu ----- */
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
function importCode(txt){
  var s = JSON.parse(decodeURIComponent(escape(atob(String(txt).trim()))));
  if(!valid(s)) throw new Error("bad");
  if(!s.notes) s.notes = {};
  if(typeof s.start!=="string") s.start = "";
  return fixSolo(s);
}

/* ----- sự kiện ----- */
function go(d){ if(d<0||d>=N) return; view="day"; current=d; renderAll(); window.scrollTo(0,0); }
function renderAll(){ renderTop(); if(view==="day") renderDay(); else if(view==="coach") renderCoach(); else renderSum(); }
function msg(t){ var m=document.getElementById("msg"); if(m) m.textContent=t; }

document.getElementById("kids").addEventListener("click", function(e){
  var b = e.target.closest(".kid"); if(b) switchKid(b.getAttribute("data-kid"));
});
document.getElementById("weeks").addEventListener("click", function(e){
  var b = e.target.closest(".wk"); if(!b) return;
  var w = b.getAttribute("data-w");
  if(w==="sum"){ view="sum"; renderAll(); window.scrollTo(0,0); return; }
  if(w==="coach"){ view="coach"; renderAll(); window.scrollTo(0,0); return; }
  w = parseInt(w,10);
  var t = todayIndex();
  go((view==="day" && Math.floor(current/7)===w) ? current : (t!==null && Math.floor(t/7)===w ? t : w*7));
});
document.getElementById("days").addEventListener("click", function(e){
  var b = e.target.closest(".dy"); if(b) go(parseInt(b.getAttribute("data-d"),10));
});
document.getElementById("main").addEventListener("click", function(e){
  var el = e.target.closest("[data-go],[data-sum],[data-coach],[data-solo],#fav,#prev,#next,#btnToday,#btnExport,#btnCopy,#btnImport,#btnReset");
  if(!el) return;
  if(el.hasAttribute("data-go")) return go(parseInt(el.getAttribute("data-go"),10));
  if(el.hasAttribute("data-sum")){ view="sum"; renderAll(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-coach")){ view="coach"; renderAll(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-solo")){
    var w = Math.floor(current/7), n = state.solo[w] + parseInt(el.getAttribute("data-solo"),10);
    state.solo[w] = Math.max(0, Math.min(99, n)); save(); renderCoach(); return;
  }
  switch(el.id){
    case "fav": state.fav[current] = state.fav[current]?0:1; save(); renderAll(); break;
    case "prev": go(current-1); break;
    case "next": go(current+1); break;
    case "btnToday":
      var d = new Date();
      state.start = d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
      save(); go(0); break;
    case "btnExport": document.getElementById("code").value = exportCode(); msg("Đã tạo mã. Bấm “Sao chép” rồi dán vào nơi anh/chị muốn cất."); break;
    case "btnCopy":
      var c = document.getElementById("code"); if(!c.value) c.value = exportCode();
      c.select();
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(c.value).then(function(){ msg("Đã sao chép mã."); }, function(){ msg("Không tự sao chép được, hãy giữ tay vào ô mã để sao chép."); }); }
      else msg("Hãy giữ tay vào ô mã để sao chép.");
      break;
    case "btnImport":
      try{
        var s = importCode(document.getElementById("code").value);
        if(confirm("Thay toàn bộ tiến độ hiện tại bằng bản sao lưu này?")){ state = s; save(); current = initialDay(); renderAll(); msg("Đã khôi phục."); }
      }catch(err){ msg("Mã không hợp lệ. Hãy dán đầy đủ đoạn mã đã sao lưu."); }
      break;
    case "btnReset":
      if(confirm("Xóa toàn bộ tiến độ, ghi chú và ngày bắt đầu?")){ state = blank(); save(); current = 0; renderAll(); }
      break;
  }
});
document.getElementById("main").addEventListener("change", function(e){
  var id = e.target.id;
  if(id==="cPlayed"){
    state.played[current] = e.target.checked?1:0;
    if(!e.target.checked) state.passed[current] = 0;
    save(); renderAll();
  } else if(id==="cPassed"){
    state.passed[current] = e.target.checked?1:0;
    if(e.target.checked) state.played[current] = 1;
    save(); renderAll();
  } else if(id==="start"){
    state.start = e.target.value; save();
    var t = todayIndex(); if(t!==null) current = t;
    renderAll();
  }
});
document.getElementById("main").addEventListener("input", function(e){
  if(e.target.id==="note"){
    if(e.target.value) state.notes[current] = e.target.value; else delete state.notes[current];
    save();
  }
});

renderAll();
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
