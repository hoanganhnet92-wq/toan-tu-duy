<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<title>Toán tư duy cho bé 4 tuổi – Lộ trình 7 ngày</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#23302d; --muted:#667570;
  --brand:#2f7d6d; --brand-soft:#e1f0ec; --gold:#c98a12; --gold-soft:#fbf0d6;
  --line:#e3ded2; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--brand);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:1.2rem;line-height:1.3}
header p{margin:4px 0 0;font-size:.85rem;opacity:.9}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.progress{margin-top:12px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#ffd36b;width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;font-size:.8rem;margin-top:6px;opacity:.95}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 4px;max-width:720px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;text-align:center;font:inherit;font-size:.78rem;color:var(--ink);cursor:pointer;position:relative}
.tab b{display:block;font-size:.95rem}
.tab.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.tab.today::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tab .mark{display:block;font-size:.7rem;color:var(--muted);height:1em}
.tab.full .mark{color:var(--brand);font-weight:700}
main{max-width:720px;margin:0 auto;padding:10px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:10px}
.day-title{margin:0;font-size:1.15rem;line-height:1.3}
.badge{display:inline-block;font-size:.72rem;background:var(--gold-soft);color:#7a5200;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.goal{color:var(--muted);margin:6px 0 0;font-size:.92rem}
h3{margin:16px 0 6px;font-size:.95rem;color:var(--brand)}
ol,ul{margin:0;padding-left:1.2rem}
li{margin:4px 0}
.ask{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-top:6px}
.ask li{margin:3px 0}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.checks{display:grid;gap:10px;margin-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.check input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--brand);flex:0 0 auto}
.check.on{border-color:var(--brand);background:var(--brand-soft)}
.check strong{display:block}
.check small{color:var(--muted);display:block;font-size:.82rem;line-height:1.4;margin-top:2px}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button,.tools button,.tools input{font:inherit}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink)}
.nav button:disabled{opacity:.4}
.tools{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:14px;font-size:.85rem;color:var(--muted)}
.tools label{display:block;margin-bottom:8px}
.tools input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-left:6px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px;margin-top:4px}
.tools button.danger{color:#a33}
.note{font-size:.78rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Toán tư duy cho bé 4 tuổi</h1>
    <p>Lộ trình 7 ngày · mỗi ngày 10–15 phút · học qua chơi</p>
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="stats"><span id="sPlayed"></span><span id="sPassed"></span></div>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Chọn ngày"></nav>
<main id="main"></main>

<script>
"use strict";
var DAYS = [
 {
  name:"Thứ 2", title:"Số là “bao nhiêu” chứ không chỉ là tên",
  goal:"Bé hiểu số cuối khi đếm là tổng số lượng, và biết số lượng không đổi dù xếp khác đi.",
  mats:"7–10 viên bi (hạt, nút áo, hoặc thìa), 1 cái khăn hoặc cốc úp.",
  steps:[
   "Đặt 7 viên bi thành một hàng. Cho bé đếm và hỏi “Có tất cả mấy viên?”.",
   "Xếp lại 7 viên thành vòng tròn rồi hỏi lại “Bây giờ có mấy viên?” (không đếm lại cũng được).",
   "Dùng khăn che 2–3 viên khi bé nhìn thấy. Hỏi “Còn mấy viên?”. Mở khăn ra để bé kiểm tra.",
   "Đổi vai: bé che, bố mẹ đoán."
  ],
  ask:["Con làm sao biết còn mấy viên?","Nếu mình xếp thành hàng dài hơn thì có nhiều bi hơn không?"],
  tip:"Nếu bé đếm lại từ 1 mỗi lần cũng bình thường. Thử số nhỏ hơn (3–5) trước rồi tăng dần.",
  passTxt:"Bé nói đúng số còn lại sau khi che bớt, ít nhất 4/5 lần với số trong phạm vi 7, và biết số không đổi khi xếp lại."
 },
 {
  name:"Thứ 3", title:"Tách và ghép số",
  goal:"Bé thấy một số có thể tách thành hai phần bằng nhiều cách (nền tảng của phép cộng).",
  mats:"10 hạt (hoặc bi), 2 cái cốc hoặc 2 cái đĩa.",
  steps:[
   "Đặt 5 hạt trước mặt bé. Nói “Mình chia 5 hạt vào 2 cốc nhé”.",
   "Cho bé tự bỏ hạt vào 2 cốc. Mỗi lần xong, hỏi “Cốc này mấy, cốc kia mấy, tất cả là mấy?”.",
   "Hỏi “Còn cách chia nào khác không?”. Ghi lại bằng hạt: 0+5, 1+4, 2+3…",
   "Nếu bé làm tốt, chuyển sang 10 hạt và làm tương tự."
  ],
  ask:["Con chia thế nào? Còn cách nào khác không?","Cốc kia có mấy hạt, con đoán xem?"],
  tip:"Không cần dạy ký hiệu cộng. Chỉ cần bé nói được “2 và 3 là 5”.",
  passTxt:"Bé tự tìm được ít nhất 3 cách chia 5 hạt (hoặc 3 cách chia 10 hạt) và nói đúng tổng."
 },
 {
  name:"Thứ 4", title:"Cộng qua câu chuyện",
  goal:"Bé biết thêm vào nghĩa là gộp lại, và tự làm ra đáp án bằng đồ vật.",
  mats:"Đồ chơi nhỏ (xe, thú nhựa…), quả thật như cam, bánh.",
  steps:[
   "Kể: “Con có 3 chiếc xe, bạn cho thêm 2 chiếc. Giờ con có mấy chiếc?”. Để bé tự bày xe ra và đếm.",
   "Thêm 2–3 bài nữa trong phạm vi 10 (ví dụ 4+3, 5+2, 6+1).",
   "Đổi vai: để bé tự bịa một câu chuyện cộng và hỏi bố mẹ.",
   "Có thể cố tình đáp sai một lần để bé phát hiện và sửa."
  ],
  ask:["Con làm thế nào mà biết?","Trước khi bạn cho thêm con có mấy chiếc, sau đó mấy chiếc?"],
  tip:"Chưa cần bé đếm nhẩm trong đầu. Dùng đồ vật làm đáp án là đạt mục tiêu rồi.",
  passTxt:"Bé giải đúng ít nhất 3/4 bài toán truyện (trong phạm vi 10) bằng đồ vật, và tự ra được một đề."
 },
 {
  name:"Thứ 5", title:"Nhiều hơn, ít hơn bao nhiêu",
  goal:"Bé so sánh hai nhóm bằng cách ghép cặp một-một và nói được chênh lệch.",
  mats:"2 nhóm xe hoặc thú nhựa (ví dụ 6 xe đỏ, 4 xe xanh), hoặc 2 loại nút áo.",
  steps:[
   "Đặt 2 hàng xe song song, hỏi “Hàng nào nhiều hơn?” trước khi đếm. Cho bé đoán.",
   "Ghép từng xe đỏ với một xe xanh theo cặp. Hỏi “Còn xe nào không có cặp?”.",
   "Hỏi “Hàng đỏ nhiều hơn hàng xanh mấy xe?”. Đếm số xe lẻ để kiểm tra.",
   "Lặp lại với số khác (chênh lệch 1–3 xe là đủ)."
  ],
  ask:["Con thấy hàng nào nhiều hơn? Con kiểm tra bằng cách nào?","Phải thêm mấy xe xanh thì hai hàng bằng nhau?"],
  tip:"Thử xếp hàng ít hơn thưa ra cho trông dài hơn để xem bé có bị đánh lừa không, rồi cùng ghép cặp để kiểm tra.",
  passTxt:"Bé ghép cặp đúng, nói được hàng nào nhiều hơn và nhiều hơn mấy (chênh lệch trong phạm vi 5)."
 },
 {
  name:"Thứ 6", title:"Quy luật (pattern)",
  goal:"Bé nhận ra và tiếp nối quy luật lặp lại, rồi tự tạo quy luật mới.",
  mats:"Hạt hoặc khối lego 2–3 màu, hoặc nút áo, lá cây.",
  steps:[
   "Xếp mẫu ABAB (đỏ–xanh–đỏ–xanh). Hỏi “Tiếp theo là gì?” và để bé nối tiếp.",
   "Nâng lên AABAAB (đỏ–đỏ–xanh–đỏ–đỏ–xanh), sau đó ABC nếu bé thích.",
   "Đổi vai: bé tạo mẫu, bố mẹ đoán (cố tình đoán sai một lần để bé sửa).",
   "Tìm quy luật quanh nhà: sọc áo, gạch lát, nhịp vỗ tay."
  ],
  ask:["Con thấy cái gì lặp lại?","Con đoán cái thứ 10 là màu gì?"],
  tip:"Có thể dùng nhịp vỗ tay (vỗ–vỗ–dậm) để chơi quy luật bằng âm thanh.",
  passTxt:"Bé nối tiếp đúng mẫu ABAB và AABAAB, và tự tạo ít nhất một mẫu của riêng mình."
 },
 {
  name:"Thứ 7", title:"Hình và không gian",
  goal:"Bé dùng được các từ chỉ vị trí và nhận ra hình khối quanh mình.",
  mats:"Một món đồ chơi để giấu, các khối hình hoặc đồ vật tròn, vuông, tam giác trong nhà.",
  steps:[
   "Chơi “kho báu”: giấu đồ chơi, chỉ dẫn từng bước như “Đi 3 bước, rẽ trái, nhìn dưới cái ghế”.",
   "Đổi vai: bé giấu và chỉ dẫn cho bố mẹ, bé dùng từ trên, dưới, trong, cạnh, trước, sau.",
   "Săn hình khối: tìm 3 vật hình tròn, 3 vật hình vuông/chữ nhật quanh nhà.",
   "Cho bé xếp các khối hình thành ngôi nhà hoặc con vật, rồi gọi tên các hình đã dùng."
  ],
  ask:["Con đang đứng ở đâu so với cái ghế?","Vì sao con chọn hình này cho mái nhà?"],
  tip:"Nếu bé lẫn trái/phải thì dùng từ khác như “phía cửa”, “phía cửa sổ” trước.",
  passTxt:"Bé làm theo 3 chỉ dẫn vị trí liên tiếp và gọi tên đúng ít nhất 2 hình (tròn, vuông, tam giác…)."
 },
 {
  name:"Chủ nhật", title:"Giải quyết vấn đề và ôn lại",
  goal:"Bé vận dụng tổng hợp để giải một tình huống thật và giải thích cách nghĩ.",
  mats:"8 miếng bánh (hoặc bi, nho), 2–4 chiếc đĩa, đồ chơi hình người hoặc thú.",
  steps:[
   "Kể: “Có 8 miếng bánh, chia đều cho 2 bạn. Mỗi bạn được mấy miếng?”. Cho bé tự chia từng miếng một.",
   "Hỏi tiếp “Nếu có 4 bạn thì sao?”. Chia lại bằng đồ vật.",
   "Hỏi “Con làm thế nào mà biết?” và để bé giải thích bằng lời hoặc làm lại cho xem.",
   "Cuối buổi, cho bé tự chọn lại một trò yêu thích trong tuần để chơi."
  ],
  ask:["Vì sao con chia như vậy?","Nếu thừa một miếng thì mình làm gì?"],
  tip:"Nếu bé chia chưa đều, đừng sửa ngay. Hỏi “Hai bạn đã có bằng nhau chưa?” để bé tự kiểm tra.",
  passTxt:"Bé chia đều 8 cho 2 bạn (và thử với 4 bạn) và nói được cách mình làm."
 }
];

var KEY = "toan-tu-duy-v1";
var state = load();
var current = initialDay();

function load(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && s.played && s.passed) return s;
  }catch(e){}
  return {played:[0,0,0,0,0,0,0], passed:[0,0,0,0,0,0,0], start:""};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function daysSinceStart(){
  if(!state.start) return null;
  var a = new Date(state.start+"T00:00:00");
  var b = new Date(); b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}
function todayIndex(){
  var d = daysSinceStart();
  return (d!==null && d>=0 && d<7) ? d : null;
}
function initialDay(){
  var t = todayIndex();
  if(t!==null) return t;
  for(var i=0;i<7;i++){ if(!state.passed[i]) return i; }
  return 0;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function li(arr){ return arr.map(function(x){return "<li>"+esc(x)+"</li>";}).join(""); }

function renderTabs(){
  var t = todayIndex();
  var h = "";
  DAYS.forEach(function(d,i){
    var cls = "tab"+(i===current?" active":"")+(i===t?" today":"")+(state.passed[i]?" full":"");
    var mark = state.passed[i] ? "✓✓" : (state.played[i] ? "✓" : "");
    h += '<button class="'+cls+'" data-i="'+i+'"><span class="mark">'+mark+'</span><b>'+(i+1)+'</b>'+esc(d.name)+'</button>';
  });
  document.getElementById("tabs").innerHTML = h;
}

function renderStats(){
  var p = state.played.reduce(function(a,b){return a+b;},0);
  var q = state.passed.reduce(function(a,b){return a+b;},0);
  document.getElementById("sPlayed").textContent = "Đã chơi: "+p+"/7";
  document.getElementById("sPassed").textContent = "Đạt yêu cầu: "+q+"/7";
  document.getElementById("bar").style.width = Math.round(q/7*100)+"%";
}

function renderDay(){
  var d = DAYS[current], t = todayIndex();
  var badge = (current===t) ? "Hôm nay · Ngày "+(current+1) : "Ngày "+(current+1)+" · "+d.name;
  var h = '<div class="card">'
   + '<span class="badge">'+esc(badge)+'</span>'
   + '<h2 class="day-title">'+esc(d.title)+'</h2>'
   + '<p class="goal"><b>Mục tiêu:</b> '+esc(d.goal)+'</p>'
   + '<h3>Chuẩn bị</h3><div>'+esc(d.mats)+'</div>'
   + '<h3>Cách chơi</h3><ol>'+li(d.steps)+'</ol>'
   + '<h3>Câu hỏi nên hỏi bé</h3><div class="ask"><ul>'+li(d.ask)+'</ul></div>'
   + '<div class="tip"><b>Lưu ý:</b> '+esc(d.tip)+'</div>'
   + '</div>'
   + '<div class="card"><h3 style="margin-top:0">Theo dõi</h3><div class="checks">'
   + '<label class="check'+(state.played[current]?' on':'')+'"><input type="checkbox" id="cPlayed"'+(state.played[current]?' checked':'')+'><span><strong>Đã chơi trò này</strong><small>Tích sau khi hai bố con/mẹ con đã chơi xong.</small></span></label>'
   + '<label class="check'+(state.passed[current]?' on':'')+'"><input type="checkbox" id="cPassed"'+(state.passed[current]?' checked':'')+'><span><strong>Bé đạt yêu cầu</strong><small>'+esc(d.passTxt)+'</small></span></label>'
   + '</div></div>'
   + '<div class="nav"><button id="prev"'+(current===0?' disabled':'')+'>← Ngày trước</button><button id="next"'+(current===6?' disabled':'')+'>Ngày sau →</button></div>';

  var tools = '<div class="tools"><label>Ngày bắt đầu lộ trình (để đánh dấu “hôm nay”): <input type="date" id="start" value="'+esc(state.start)+'"></label>'
   + '<button id="btnToday">Bắt đầu từ hôm nay</button>'
   + '<button class="danger" id="btnReset">Xóa tiến độ</button>'
   + '<div class="note">Tiến độ được lưu ngay trên trình duyệt của thiết bị này. Đổi điện thoại hoặc xóa dữ liệu trình duyệt thì sẽ mất. Tiêu chí “đạt” là gợi ý để tham khảo, bố mẹ có thể điều chỉnh theo bé. Nếu bé chưa đạt, cứ chơi lại vào ngày khác.</div></div>';
  document.getElementById("main").innerHTML = h + tools;
  bind();
}

function bind(){
  document.getElementById("cPlayed").onchange = function(e){
    state.played[current] = e.target.checked ? 1 : 0;
    if(!e.target.checked) state.passed[current] = 0;
    save(); renderAll();
  };
  document.getElementById("cPassed").onchange = function(e){
    state.passed[current] = e.target.checked ? 1 : 0;
    if(e.target.checked) state.played[current] = 1;
    save(); renderAll();
  };
  document.getElementById("prev").onclick = function(){ go(current-1); };
  document.getElementById("next").onclick = function(){ go(current+1); };
  document.getElementById("start").onchange = function(e){
    state.start = e.target.value; save(); var t = todayIndex(); if(t!==null) current = t; renderAll();
  };
  document.getElementById("btnToday").onclick = function(){
    var d = new Date(), m = ("0"+(d.getMonth()+1)).slice(-2), dd = ("0"+d.getDate()).slice(-2);
    state.start = d.getFullYear()+"-"+m+"-"+dd; save(); current = 0; renderAll();
  };
  document.getElementById("btnReset").onclick = function(){
    if(confirm("Xóa toàn bộ tiến độ và ngày bắt đầu?")){
      state = {played:[0,0,0,0,0,0,0], passed:[0,0,0,0,0,0,0], start:""};
      save(); current = 0; renderAll();
    }
  };
}
function go(i){ if(i<0||i>6) return; current = i; renderAll(); window.scrollTo(0,0); }
function renderAll(){ renderTabs(); renderStats(); renderDay(); }

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab"); if(b) go(parseInt(b.getAttribute("data-i"),10));
});
renderAll();
</script>
</body>
</html>
